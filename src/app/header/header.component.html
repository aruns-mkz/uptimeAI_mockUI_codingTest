<header class="header">

  <li class="list-group-item" aria-current="true"><svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"

    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    width="24"
    height="24"
>
  <!-- Home outline -->
  <path d="M3 12L12 3l9 9v8a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-4H9v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-8z"/>
  

</svg>

Home</li>
  <li class="list-group-item"><svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    width="24"
    height="24"
>

  <circle cx="12" cy="12" r="10"/>
  
 
</svg>
Issues</li>
  <li class="list-group-item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Left node -->
  <circle cx="6" cy="6" r="2"
          stroke="currentColor" stroke-width="1.5"/>

  <!-- Right node -->
  <circle cx="18" cy="18" r="2"
          stroke="currentColor" stroke-width="1.5"/>

  <!-- Vertical path -->
  <path d="M6 8v5c0 2.21 1.79 4 4 4h4"
        stroke="currentColor" stroke-width="1.5"
        stroke-linecap="round"/>

  <path d="M14 13l4 4-4 4"
        stroke="currentColor" stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

</svg>
Pull request</li>
  <li class="list-group-item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"
     xmlns="http://www.w3.org/2000/svg">

        stroke="currentColor" stroke-width="1.5"/>
 
  <line x1="6" y1="13" x2="18" y2="13"
        stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
</svg>
Repositories</li>
  <li class="list-group-item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"
     xmlns="http://www.w3.org/2000/svg">

        stroke="currentColor" stroke-width="1.5"/>

  <!-- Columns -->

        stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
  <line x1="15" y1="4" x2="15" y2="20"
        stroke="currentColor" stroke-width="1.5" opacity="0.6"/>


</svg>
Project</li>
  <li class="list-group-item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Main bubble -->
  <path d="M4 6.5C4 5.12 5.12 4 6.5 4h11
           C18.88 4 20 5.12 20 6.5v6
           c0 1.38-1.12 2.5-2.5 2.5H10l-4 3v-3H6.5
           C5.12 15 4 13.88 4 12.5v-6Z"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <!-- Reply bubble -->
  <path d="M9 10.5h6"
        stroke="currentColor"
        stroke-width="1.5"
        opacity="0.6"/>

  <path d="M9 13.5h4"
        stroke="currentColor"
        stroke-width="1.5"
        opacity="0.6"/>

</svg>
Discussion</li>
  <li class="list-group-item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"
     xmlns="http://www.w3.org/2000/svg">

        stroke="currentColor"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <!-- Code brackets -->
  <path d="M9 9l-2 3 2 3"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <path d="M15 9l2 3-2 3"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

</svg>
codespaces</li>

        stroke-width="1.5"

  <!-- Eyes -->
  <circle cx="9" cy="12" r="1.5" fill="currentColor"/>
  <circle cx="15" cy="12" r="1.5" fill="currentColor"/>

  <!-- Base -->
  <path d="M8 18h8"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        opacity="0.6"/>

</svg>
copilot</li>
</ul>
