<section>
  <h3>Popular Repositories</h3>
<div class="repo-container" *ngIf="userRepoData?.length;">

  <div class="repo-card" *ngFor="let repo of userRepoData">
  <div class="repo-header">
    <h3 class="repo-name"><a href="#">{{repo.name}}</a></h3>
    <span class="repo-badge">{{repo.visibility}}</span>
  </div>
  <p class="repo-description">
{{repo.description}}  </p>
  <div class="repo-stats">
    <span class="repo-lang" *ngIf="repo.language != null"><span class="lang-color"></span> {{repo.language}}</span>
    <span class="repo-stars">★ 3.5k</span>
    <span class="repo-forks">🍴 420</span>
  </div>
</div>
</div>
</section>
<app-contribution-graph></app-contribution-graph>
<div class="contribution-activity">
  <app-contribution-activity></app-contribution-activity>

</div>
